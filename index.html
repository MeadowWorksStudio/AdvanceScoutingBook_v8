<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ADVANCE SCOUTING BOOK — Pitch Call Prototype v8 Review Build</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --turf:#1F4D2C;
    --turf-dark:#153620;
    --clay:#A85832;
    --chalk:#F5F2E8;
    --ink:#14181A;
    --amber:#E8A33D;
    --steel:#3D5A6C;
    --steel-light:#5C7C8F;
    --danger:#B5462F;
    --good:#4C8B5A;
    font-family:'IBM Plex Sans',sans-serif;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  

  

  
  
  

  /* ---- device frame ---- */
  
  

  /* ---- top status bar ---- */
  .statbar{
    background:var(--ink);
    padding:10px 16px 8px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:0.03em;
    border-bottom:2px solid var(--amber);
  }
  .statbar .seg{color:#8FA79B;}
  .statbar .seg b{color:var(--chalk); font-weight:600;}
  .statbar .count{
    color:var(--amber);
    font-weight:600;
    font-size:13px;
  }
  .outs{display:flex; gap:4px; align-items:center;}
  .out-dot{width:7px; height:7px; border-radius:50%; background:#3A4842; border:1px solid #5c6d64;}
  .out-dot.filled{background:var(--danger); border-color:var(--danger);}

  .backrow{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 16px 0;
  }
  .backbtn{
    background:none; border:none; color:#BFD3C6; font-size:12px;
    font-family:'IBM Plex Sans',sans-serif; font-weight:500;
    display:flex; align-items:center; gap:4px; cursor:pointer; padding:4px 0;
  }
  .backbtn:hover{color:var(--amber);}

  .content{
    flex:1;
    padding:12px 16px 20px;
    overflow-y:auto;
    overflow-x:hidden;
  }

  /* ---- section label ---- */
  .label{
    font-family:'Oswald',sans-serif;
    font-size:11.5px;
    font-weight:600;
    letter-spacing:0.12em;
    color:var(--amber);
    text-transform:uppercase;
    margin:14px 0 8px;
  }
  .label:first-child{margin-top:2px;}

  /* ---- batter header ---- */
  .batter-head{
    display:flex; flex-wrap:wrap; align-items:center; gap:10px;
    background:rgba(0,0,0,0.18);
    border-radius:14px;
    padding:10px 12px;
    margin-top:4px;
  }
  .pitcher-head{ margin-bottom:10px; }
  .batter-num{
    font-family:'Oswald',sans-serif; font-weight:700; font-size:20px;
    background:var(--amber); color:var(--ink);
    width:38px; height:38px; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .pitcher-num{ background:var(--steel-light); color:var(--ink); }
  .head-text{ flex:1 1 140px; min-width:140px; overflow-wrap:break-word; word-break:break-word; }
  .batter-name{font-family:'Oswald',sans-serif; font-weight:600; font-size:16px; letter-spacing:0.02em; overflow-wrap:break-word; word-break:break-word;}
  .batter-sub{font-size:11px; color:#B9C7BE; margin-top:1px; overflow-wrap:break-word; word-break:break-word;}

  /* ---- lineup cards ---- */
  .lineup-card{
    display:flex; flex-wrap:wrap; align-items:center; gap:12px;
    background:rgba(0,0,0,0.18);
    border-radius:14px;
    padding:12px;
    margin-bottom:10px;
    cursor:pointer;
    border:1px solid transparent;
    transition:border-color 0.15s, background 0.15s;
  }
  .lineup-card > div:not(.batter-num):not(.badge):not(.change-batter-btn){ flex:1 1 140px; min-width:140px; overflow-wrap:break-word; word-break:break-word; }
  .lineup-card:hover{border-color:var(--amber); background:rgba(0,0,0,0.28);}
  .lineup-card .badge{
    margin-left:auto;
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    padding:4px 8px;
    border-radius:20px;
    white-space:nowrap;
    flex-shrink:0;
  }
  .lineup-banner-btn{align-self:center;background:rgba(232,163,61,.12);border:1px solid var(--amber);border-radius:9px;color:var(--amber);font-weight:800;font-size:11px;padding:10px 8px;cursor:pointer;white-space:nowrap;}
  .lineup-record{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--amber);white-space:nowrap;}
  .lineup-tools{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap;}
  .lineup-tools button,.lineup-edit{background:#26372f;color:#f2f5ef;border:1px solid #607469;border-radius:8px;padding:9px;cursor:pointer;font-size:11px;font-weight:700;}
  .lineup-card.active-batter{border-color:var(--amber);}
  .badge.scouted{background:rgba(232,163,61,0.18); color:var(--amber); border:1px solid rgba(232,163,61,0.4);}
  .badge.fresh{background:rgba(255,255,255,0.06); color:#8FA79B; border:1px solid rgba(255,255,255,0.1);}

  /* ---- pitch grid buttons ---- */
  .pitch-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:4px;
  }
  .pitch-btn{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    font-size:14.5px;
    letter-spacing:0.03em;
    background:rgba(0,0,0,0.2);
    border:1.5px solid var(--steel-light);
    color:var(--chalk);
    padding:18px 8px;
    border-radius:14px;
    cursor:pointer;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    transition:transform 0.08s, background 0.15s, border-color 0.15s;
  }
  .pitch-btn:hover{border-color:var(--amber); background:rgba(232,163,61,0.12);}
  .pitch-btn:active{transform:scale(0.97);}
  .pitch-btn.selected{
    border-color:var(--amber); background:rgba(232,163,61,0.2); color:var(--amber);
  }
  .pitch-btn.suggested{
    border-color:var(--amber);
    background:rgba(232,163,61,0.14);
    box-shadow:0 0 0 1px rgba(232,163,61,0.4) inset;
  }
  .suggest-tag{
    font-family:'IBM Plex Mono',monospace;
    font-size:9px;
    font-weight:700;
    letter-spacing:0.1em;
    color:var(--amber);
  }
  .suggest-reason{
    font-family:'IBM Plex Sans',sans-serif;
    font-weight:500;
    font-size:9.5px;
    letter-spacing:0.01em;
    text-transform:none;
    color:#D8E4DC;
    line-height:1.3;
    max-width:140px;
  }


  /* Adaptive call tiles: available height is shared by the number of pitch rows.
     Keep a minimum tap target and permit scrolling on unusually short screens. */
  .call-pitch-grid{
    --pitch-rows:2;
    --pitch-tile-height:clamp(64px, calc((100dvh - 440px) / var(--pitch-rows)), 160px);
    grid-auto-rows:var(--pitch-tile-height);
    gap:6px;
  }
  .call-pitch-grid > .pitch-btn{
    height:100%; min-height:0; min-width:0; box-sizing:border-box;
    padding:5px 6px; overflow:hidden; gap:2px;
  }
  .call-pitch-grid > .pitch-btn:last-child:nth-child(odd){
    grid-column:1 / -1;
  }
  .call-pitch-grid .suggest-reason{
    display:-webkit-box; -webkit-box-orient:vertical;
    -webkit-line-clamp:2; line-clamp:2;
    overflow:hidden; max-width:100%; line-height:1.2;
    font-size:clamp(8px,1.1dvh,10px); overflow-wrap:anywhere;
  }
  .call-pitch-grid .suggest-location{
    font-size:clamp(10px,1.55dvh,14px);
    line-height:1.15; overflow-wrap:anywhere;
  }
  .call-pitch-grid .pitch-name{font-size:clamp(12px,1.8dvh,15px);line-height:1.1;}
  .call-pitch-grid .suggest-tag{font-size:8px;line-height:1.1;}
  .call-scout-grid{gap:6px;}
  .call-scout-grid > .pitch-btn{padding:8px 6px;min-height:54px;gap:2px;}
  .call-scout-grid .suggest-reason{font-size:9px;line-height:1.2;}
  @media(max-height:650px){
    .call-pitch-grid{--pitch-tile-height:clamp(58px, calc((100dvh - 395px) / var(--pitch-rows)), 120px);}
    .call-scout-grid > .pitch-btn{min-height:48px;padding:6px 5px;}
  }

  /* ---- scouting stat rows ---- */
  .stat-row{
    display:flex; align-items:center; gap:10px;
    padding:8px 0;
    border-bottom:1px solid rgba(255,255,255,0.06);
  }
  .stat-row:last-child{border-bottom:none;}
  .stat-type{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:600;
    width:78px; flex-shrink:0; color:var(--chalk);
  }
  .stat-bar-track{
    flex:1; height:6px; background:rgba(0,0,0,0.25); border-radius:4px; overflow:hidden;
  }
  .stat-bar-fill{height:100%; background:var(--amber); border-radius:4px;}
  .stat-pct{
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:#B9C7BE; width:34px; text-align:right; flex-shrink:0;
  }
  .stat-exec{
    font-family:'IBM Plex Mono',monospace; font-size:9.5px; font-weight:600;
    padding:3px 7px; border-radius:10px; margin-left:6px; white-space:nowrap; flex-shrink:0;
  }
  .stat-exec.good{background:rgba(76,139,90,0.18); color:var(--good); border:1px solid rgba(76,139,90,0.4);}
  .stat-exec.mid{background:rgba(232,163,61,0.18); color:var(--amber); border:1px solid rgba(232,163,61,0.4);}
  .stat-exec.bad{background:rgba(181,70,47,0.18); color:var(--danger); border:1px solid rgba(181,70,47,0.4);}
  .stat-note{
    font-size:10.5px; color:#8FA79B; margin-top:2px; padding-left:88px;
  }
  .empty-scout{
    font-size:12px; color:#8FA79B; line-height:1.5; background:rgba(0,0,0,0.15);
    padding:12px; border-radius:12px; margin-top:2px;
  }

  /* ---- at-bat chip history ---- */
  .chip-row{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:2px;}
  .chip{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px;
    background:rgba(0,0,0,0.22); border:1px solid rgba(255,255,255,0.1);
    padding:5px 8px; border-radius:8px; color:#D8E4DC;
  }
  .chip.strike{border-color:rgba(232,163,61,0.5); color:var(--amber);}
  .chip.ball{border-color:rgba(92,124,143,0.6); color:var(--steel-light);}
  .chip.play{border-color:rgba(76,139,90,0.6); color:var(--good);}

  /* ---- zone grid ---- */
  .calltag{
    font-family:'Oswald',sans-serif; font-weight:600; font-size:15px;
    text-align:center; margin-bottom:14px; color:var(--chalk);
    letter-spacing:0.03em;
  }
  .calltag span{color:var(--amber);}
  .zone-wrap{max-width:230px; margin:0 auto 14px;}
  .zone-grid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    grid-template-rows:1fr 1fr 1fr;
    gap:5px;
    aspect-ratio:1/1;
    background:rgba(0,0,0,0.25);
    padding:8px;
    border-radius:14px;
    border:2px solid var(--amber);
  }
  .zone-cell{
    background:rgba(245,242,232,0.06);
    border-radius:6px;
    cursor:pointer;
    transition:background 0.12s, transform 0.08s;
  }
  .zone-cell:hover{background:rgba(232,163,61,0.35);}
  .zone-cell:active{transform:scale(0.95);}
  .chase-section{margin-top:10px;}
  .chase-dim-label{
    font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:0.1em;
    color:#7C9284; margin:8px 0 5px;
  }
  .chase-row{
    display:grid; grid-template-columns:1fr 1fr;
    gap:6px;
  }
  .chase-btn{
    font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600;
    background:rgba(0,0,0,0.2); border:1px dashed rgba(255,255,255,0.25);
    color:#9FB3A7; padding:16px 4px; border-radius:8px; cursor:pointer; text-align:center;
    transition:background 0.12s, border-color 0.12s, color 0.12s;
    line-height:1.4;
  }
  .chase-btn:hover{border-color:var(--amber); color:var(--amber);}
  .chase-btn.selected{
    background:rgba(232,163,61,0.22); border:1px solid var(--amber); color:var(--amber);
  }
  .chase-confirm{
    margin-top:12px; width:100%;
    font-family:'Oswald',sans-serif; font-weight:600; font-size:13px; letter-spacing:0.03em;
    padding:13px; border-radius:12px; text-align:center; cursor:pointer;
    border:1.5px solid var(--good); background:rgba(76,139,90,0.15); color:var(--good);
    transition:background 0.15s;
  }
  .chase-confirm:hover{background:rgba(76,139,90,0.28);}
  .chase-confirm.disabled{
    border-color:rgba(255,255,255,0.15); background:rgba(0,0,0,0.15); color:#5C6D64;
    cursor:default; pointer-events:none;
  }
  .zone-caption{
    text-align:center; font-size:10.5px; color:#8FA79B; margin-top:8px;
  }

  /* ---- thumbs ---- */
  .thumbs-row{display:flex; gap:12px; margin-top:6px;}
  .thumb-btn{
    flex:1; padding:26px 8px;
    border-radius:16px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    font-family:'Oswald',sans-serif; font-weight:600; font-size:13px; letter-spacing:0.04em;
    border:1.5px solid var(--steel-light); background:rgba(0,0,0,0.2); color:var(--chalk);
    transition:transform 0.08s, background 0.15s;
  }
  .thumb-btn:active{transform:scale(0.97);}
  .thumb-btn.up:hover{border-color:var(--good); background:rgba(76,139,90,0.15); color:var(--good);}
  .thumb-btn.down:hover{border-color:var(--danger); background:rgba(181,70,47,0.15); color:var(--danger);}
  .thumb-btn svg{width:26px; height:26px;}

  /* ---- outcome buttons ---- */
  .outcome-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .outcome-btn{
    font-family:'Oswald',sans-serif; font-weight:600; font-size:13.5px;
    padding:16px 8px; border-radius:14px; text-align:center; cursor:pointer;
    border:1.5px solid var(--steel-light); background:rgba(0,0,0,0.2); color:var(--chalk);
    transition:transform 0.08s, background 0.15s;
  }
  .outcome-btn:active{transform:scale(0.97);}
  .outcome-btn.ball:hover{border-color:var(--steel-light); background:rgba(92,124,143,0.25);}
  .outcome-btn.strike:hover{border-color:var(--amber); background:rgba(232,163,61,0.15);}
  .outcome-btn.play{grid-column:span 2; border-color:var(--good);}
  .outcome-btn.play:hover{background:rgba(76,139,90,0.18);}

  .result-grid{display:grid; grid-template-columns:1fr 1fr; gap:9px;}
  .result-btn{
    font-family:'IBM Plex Sans',sans-serif; font-weight:600; font-size:12.5px;
    padding:14px 6px; border-radius:12px; text-align:center; cursor:pointer;
    border:1.5px solid var(--steel-light); background:rgba(0,0,0,0.2); color:var(--chalk);
  }
  .result-btn:hover{border-color:var(--amber); background:rgba(232,163,61,0.12);}
  .result-btn.out{border-color:rgba(181,70,47,0.5);}
  .result-btn.hit{border-color:rgba(76,139,90,0.6);}

  .confirm-toast{
    position:absolute; bottom:16px; left:16px; right:16px;
    background:var(--amber); color:var(--ink);
    font-family:'Oswald',sans-serif; font-weight:600; font-size:13px;
    text-align:center; padding:12px; border-radius:12px;
    box-shadow:0 8px 20px -6px rgba(0,0,0,0.5);
    opacity:0; transform:translateY(10px);
    transition:opacity 0.25s, transform 0.25s;
    pointer-events:none;
  }
  .confirm-toast.show{opacity:1; transform:translateY(0);}

  .change-batter-btn{
    margin-left:auto; flex-shrink:0; flex-grow:0;
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:600;
    padding:7px 11px; border-radius:20px; white-space:nowrap; cursor:pointer;
    border:1px solid var(--steel-light); color:#B9C7BE; background:rgba(0,0,0,0.15);
    transition:border-color 0.12s, color 0.12s;
  }
  .change-batter-btn:hover{border-color:var(--amber); color:var(--amber);}

  .modal-overlay{
    position:absolute; inset:0; z-index:20;
    background:rgba(10,12,12,0.68);
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .modal-card{
    width:100%; max-width:300px;
    background:#1B2320; border:1.5px solid var(--amber); border-radius:16px;
    padding:18px; box-shadow:0 20px 40px -10px rgba(0,0,0,0.5);
  }
  .modal-title{
    font-family:'Oswald',sans-serif; font-weight:600; font-size:13.5px; letter-spacing:0.04em;
    color:var(--amber); text-align:center; margin-bottom:12px; text-transform:uppercase;
  }
  .modal-desc{
    font-size:12px; color:#D8E4DC; text-align:center; margin-bottom:14px; line-height:1.5;
  }
  .modal-row{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px;
    padding:12px; border-radius:10px; margin-bottom:8px;
    background:rgba(255,255,255,0.05); cursor:pointer;
    font-size:12.5px; color:var(--chalk);
    transition:background 0.12s;
  }
  .modal-row > span:first-child{ flex:1 1 140px; min-width:140px; overflow-wrap:break-word; word-break:break-word; }
  .modal-row > span.hand:last-child{ flex-shrink:0; }
  .modal-row:hover{background:rgba(232,163,61,0.15);}
  .modal-row span.hand{color:#8FA79B; font-size:10.5px;}
  .modal-section-label{
    font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:0.1em;
    color:#7C9284; margin:12px 0 6px; text-transform:uppercase;
  }
  .modal-section-label:first-of-type{margin-top:0;}
  .modal-row.add-player{
    justify-content:center; border:1px dashed var(--amber); color:var(--amber);
    background:rgba(232,163,61,0.08); font-weight:600; font-family:'Oswald',sans-serif;
    font-size:12px; letter-spacing:0.03em; text-transform:uppercase; margin-top:10px;
  }
  .modal-row.add-player:hover{background:rgba(232,163,61,0.18);}
  .modal-input-row{display:flex; gap:8px; margin-bottom:10px; min-width:0;}
  /* Inputs must be allowed to shrink inside the player editor. */
  .modal-input-row > input{flex:1 1 0; width:0; min-width:0; max-width:100%; box-sizing:border-box; padding:9px 7px; border-radius:8px; border:1px solid var(--steel-light); background:rgba(0,0,0,.25); color:var(--chalk); font-size:14px;}
  .modal-input-row > input:first-child:nth-last-child(2){flex:0 0 30%;}
  .modal-card{box-sizing:border-box; min-width:0; max-height:calc(100dvh - 32px); overflow-y:auto; overflow-x:hidden;}
  .modal-overlay{box-sizing:border-box; padding:16px;}
  .modal-card input{box-sizing:border-box; max-width:100%;}
  @media(max-width:380px){.modal-card{padding:14px;}.modal-input-row{gap:6px;}.modal-input-row > input{font-size:13px;padding:9px 5px;}}

  .modal-input{
    padding:11px 12px; border-radius:10px; border:1.5px solid var(--steel-light);
    background:rgba(0,0,0,0.25); color:var(--chalk); font-family:'IBM Plex Mono',monospace;
    font-size:13px;
  }
  .modal-input::placeholder{color:#5C6D64;}
  .modal-input:focus{outline:none; border-color:var(--amber);}
  .modal-hand-row{display:flex; gap:8px; margin-bottom:12px;}
  .modal-btn.selected-hand{
    border-color:var(--amber); background:rgba(232,163,61,0.18); color:var(--amber);
  }
  .modal-btn-row{display:flex; gap:10px; margin-top:2px;}
  .modal-btn{
    flex:1; padding:14px 6px; border-radius:10px; text-align:center; cursor:pointer;
    font-family:'Oswald',sans-serif; font-weight:600; font-size:12px; line-height:1.4;
    border:1.5px solid var(--steel-light); background:rgba(0,0,0,0.2); color:var(--chalk);
  }
  .modal-btn.keep:hover{border-color:var(--good); background:rgba(76,139,90,0.15); color:var(--good);}
  .modal-btn.reset:hover{border-color:var(--danger); background:rgba(181,70,47,0.15); color:var(--danger);}
  .modal-btn.disabled{
    border-color:rgba(255,255,255,0.15); background:rgba(0,0,0,0.15); color:#5C6D64;
    cursor:default; pointer-events:none;
  }
  .modal-cancel{
    text-align:center; font-size:11px; color:#8FA79B; margin-top:12px; cursor:pointer;
  }
  .modal-cancel:hover{color:var(--chalk);}

  .pitch-btn.disabled{
    border-color:rgba(255,255,255,0.15); background:rgba(0,0,0,0.15); color:#5C6D64;
    cursor:default; pointer-events:none;
  }
  .wide-btn{

<body>

<div class="intro">
  <h1>ADVANCE SCOUTING BOOK <span style="color:#8FA79B; font-weight:500;">v8</span></h1>
  <p>v7 test build — pitch calling &amp; live batter scouting workflow.<br>Tap through as if you were the pitching coach mid-game.<br><span style="color:#E8A33D;">v7: combined whiff/contact heat map, pitch + specific location suggestions, 17 locations, foul direction and integrated Test Mode.</span></p>
</div>

<div class="device">
  <div class="screen" id="screen"></div>
</div>

<script>
const MASTER_PITCHES = [
  {key:'FASTBALL', abbr:'FB'},
  {key:'CHANGEUP', abbr:'CU-CH'},
  {key:'CURVEBALL', abbr:'CB'},
  {key:'SLIDER', abbr:'SL'},
  {key:'DROP BALL', abbr:'DB'},
  {key:'RISE BALL', abbr:'RB'},
  {key:'SPLITTER', abbr:'SP'},
  {key:'KNUCKLEBALL', abbr:'KN'},
  {key:'CUTTER', abbr:'CT'},
  {key:'TWO-SEAM', abbr:'2S'},
  {key:'FOUR-SEAM', abbr:'4S'}
];
let testMode = false;
let pitchers = []; // {first,last,hand,arsenal}
let currentPitcherIdx = -1;
let nextPitcherId = 1;
function ensurePitcherId(p){ if(!p.id) p.id='pitcher-'+(nextPitcherId++); return p.id; }
function samePitcher(h,idx){
  const p=pitchers[idx]; if(!p) return false;
  return h.pitcherUid ? h.pitcherUid===ensurePitcherId(p) : h.pitcherId===idx;
}
function pitcherHistory(type){
  const out=[];
  Object.values(scoutingBook).forEach(hist=>hist.forEach(h=>{
    if(h.type===type && samePitcher(h,currentPitcherIdx)) out.push(h);
  }));
  return out;
}
let locationPerspective='catcher';
function currentArsenal(){ return currentPitcherIdx>=0 ? pitchers[currentPitcherIdx].arsenal : []; }
function currentPitcherName(){
  if(currentPitcherIdx<0) return '';
  const p = pitchers[currentPitcherIdx];
  return (p.first+' '+p.last).trim() || 'Pitcher';
}
function currentPitcherNum(){
  if(currentPitcherIdx<0) return '';
  const n = pitchers[currentPitcherIdx].num;
  return n && (''+n).trim() ? (''+n).trim() : '--';
}

const ZONE_LABELS = [
  'high-in','high-mid','high-away',
  'mid-in','mid-mid','mid-away',
  'low-in','low-mid','low-away'
];

const DEMO_HISTORY = [
  {type:'FASTBALL', zone:'low-away', result:'GROUND OUT'},
  {type:'FASTBALL', zone:'low-in', result:'CALLED STRIKE'},
  {type:'CURVEBALL', zone:'low-out', result:'BALL'},
  {type:'CHANGEUP', zone:'low-away', result:'SWINGING STRIKE'},
  {type:'FASTBALL', zone:'mid-in', result:'SINGLE'},
  {type:'SLIDER', zone:'high-away', result:'FLY OUT'},
  {type:'CHANGEUP', zone:'low-away', result:'SWINGING STRIKE'},
  {type:'FASTBALL', zone:'low-out', result:'CALLED STRIKE'}
];
let scoutingBook = {}; // persists across games within this session: "TEAM::NAME" -> live history array
function getScoutingHistory(name, team){
  const nameKey = (name||'').trim().toUpperCase();
  const teamKey = (team||'').trim().toUpperCase() || 'OPPONENT';
  if(!nameKey) return [];
  const key = teamKey + '::' + nameKey;
  if(!(key in scoutingBook)){
    scoutingBook[key] = [];
  }
  return scoutingBook[key];
}

let lineup = [];
let bench = [];
let currentGameId = 0; // increments each time a game starts/restarts — scopes "this game" spray chart data
let setupBatters = [];
let setupBench = [];

let game = {
  opponent:'',
  pitcher:{first:'', last:'', hand:'R', arsenal:[]}
};

let state = {
  view:'setupTeam',
  batterIdx:null,
  pitch:null,
  zone:null,
  count:{balls:0, strikes:0},
  outs:0,
  inning:1,
  currentAB:[],
  modal:null,
  setupPitcherIdx:null,
  bases:{first:false, second:false, third:false},
  sprayLoc:null,
  contactType:null,
  foulDirection:null,
  ballSafe:null,
  bipOuts:null,
  droppedThird:false
};

const BACK_MAP = {
  setupPitcherPick: {to:'setupTeam', clear:[]},
  setupPitcherAdd:  () => ({to: pitchers.length>0 ? 'setupPitcherPick' : 'setupTeam', clear:[]}),
  setupLineup:      {to:'setupPitcherPick', clear:[]},
  zone:             {to:'call',         clear:['pitch']},
  outcome:          {to:'zone',         clear:['zone']},
  foulDirection:    {to:'outcome',      clear:['foulDirection']},
  inplayField:      {to:'outcome',      clear:['sprayLoc']},
  inplayContact:    {to:'inplayField',  clear:['contactType']},
  inplayResult:     {to:'inplayContact',clear:['ballSafe']},
  droppedResult:    {to:'outcome',clear:['droppedThird']}
};

function goBack(){
  let map = BACK_MAP[state.view];
  if(typeof map==='function') map = map();
  if(!map) return;
  map.clear.forEach(k=> state[k]=null);
  state.view = map.to;
  render();
}

function pct(n,d){ return d===0 ? 0 : Math.round((n/d)*100); }

function typeStats(history){
  const byType = {};
  currentArsenal().forEach(p => byType[p] = {thrown:0, strikes:0, whiffs:0, fouls:0, groundBalls:0});
  history.forEach(h=>{
    const t = byType[h.type];
    if(!t || !samePitcher(h,currentPitcherIdx)) return;
    t.thrown++;
    if(['CALLED STRIKE','SWINGING STRIKE','FOUL','DROPPED THIRD CALLED','DROPPED THIRD SWINGING'].includes(h.result)) t.strikes++;
    if(['SWINGING STRIKE','DROPPED THIRD SWINGING'].includes(h.result)) t.whiffs++;
    if(h.result==='FOUL') t.fouls++;
    if(h.contactType==='GROUND BALL') t.groundBalls++;
  });
  return byType;
}

// Arsenal-wide ground-ball tendency fallback for the "runner on 1st, DP situation" rule —
// used only when this batter has no ground-ball history yet against a given pitch type.
// Scans every batter logged this session (not just the current one), since a pitch's
// ground-ball tendency is a pitcher-arsenal trait, not a matchup-specific one.
// Filter by stable pitcher identity to prevent same-named pitches blending across pitchers.
function arsenalGroundBallStats(arsenal){
  const byType = {};
  arsenal.forEach(p => byType[p] = {thrown:0, groundBalls:0});
  Object.values(scoutingBook).forEach(hist=>{
    hist.forEach(h=>{
      const t = byType[h.type];
      if(!t || !samePitcher(h,currentPitcherIdx)) return;
      t.thrown++;
      if(h.contactType==='GROUND BALL') t.groundBalls++;
    });
  });
  return byType;
}

// Rule-based pitch suggestion — combines count-state logic (ahead/behind/2-strike)
// with this-batter matchup history (whiff rate, strike%, pitches not yet shown).
// Explicitly rule-based, not a stats model — see backlog "Pitch sequencing strategy layer".
function suggestPitch(b){
  const arsenal=currentArsenal(); if(!arsenal.length)return null;
  const count=state.count;
  // Even at 0-0 against a new batter, use this pitcher's own history and neutral priors.
  const twoStrikes=count.strikes===2, behind=count.balls>count.strikes;
  const bases=state.bases, early=state.outs<2;
  const dp=early&&bases.first&&!bases.second&&!bases.third;
  const risp=bases.second||bases.third, loaded=bases.first&&bases.second&&bases.third;
  const ab=state.currentAB;
  const all=HEATMAP_CELLS.filter(c=>c.key).map(c=>c.key);
  let best=null;
  arsenal.forEach(p=>{
    const batterHist=b.history.filter(h=>h.type===p && samePitcher(h,currentPitcherIdx));
    const aggregate=pitcherHistory(p);
    const hist=batterHist.length>=4?batterHist:aggregate;
    const n=hist.length, strikes=hist.filter(h=>['CALLED STRIKE','SWINGING STRIKE','FOUL','DROPPED THIRD CALLED','DROPPED THIRD SWINGING'].includes(h.result)).length;
    const whiffs=hist.filter(h=>['SWINGING STRIKE','DROPPED THIRD SWINGING'].includes(h.result)).length;
    const gb=hist.filter(h=>h.contactType==='GROUND BALL'&&!isSafeContact(h)).length;
    const k=hist.filter(h=>['CALLED STRIKE','DROPPED THIRD CALLED'].includes(h.result)).length;
    const strikeoutFinishes=hist.filter(h=>h.strikeout).length;
    // Shrink sparse samples toward neutral; never treat a single result as proof.
    const strikeRate=(strikes+2)/(n+4), putAway=(whiffs+0.4*k)/(n+4);
    let base=twoStrikes?18+30*putAway:behind?12+32*strikeRate:12+12*strikeRate+10*putAway;
    const used=ab.filter(h=>h.type===p), fouls=used.filter(h=>h.result==='FOUL');
    if(used.length>1)base-=Math.min(9,(used.length-1)*3);
    if(fouls.length>=2)base-=Math.min(12,(fouls.length-1)*4);
    // Direction is a weak timing clue, not a guaranteed early/late diagnosis.
    const back=fouls.filter(h=>h.foulDirection==='BACK').length;
    if(back>=2)base-=Math.min(5,back*1.5);
    if(risp&&n>=3&&strikeRate<0.45)base-=5;
    if(bases.third&&early)base+=14*putAway;
    if(dp)base+=Math.min(7,gb*2.5);
    if(loaded)base+=18*strikeRate;
    if(twoStrikes)base+=Math.min(4, 12*strikeoutFinishes/(n+8));
    const zmap=zoneEffectiveness(b,p);
    all.forEach(zone=>{
      const d=zmap[zone];
      // Score the exact pitch-location pair; only observations for this pitch count.
      const locationEvidence=Math.min(1,d.thrown/6);
      const locationScore=d.thrown?( -d.score/d.thrown)*18*locationEvidence:0;
      const chase=zone.startsWith('out-');
      if(chase && count.balls===3) return; // hard rule: never recommend chase at 3-0, 3-1, 3-2
      const chaseAdjustment=chase?(twoStrikes?1.5:behind?-7:-2):0;
      const neutralPrior=['low-away','low-in','mid-away','mid-in','low-mid','high-away','high-in','high-mid','mid-mid'];
      const prior= d.thrown===0 ? (neutralPrior.indexOf(zone)>=0 ? (neutralPrior.length-neutralPrior.indexOf(zone))*0.025 : -0.4) : 0;
      const score=base+locationScore+chaseAdjustment+prior;
      if(!best||score>best.score){
        let reason;
        if(d.thrown>=3&&d.whiffs>=2)reason=`${d.whiffs} whiffs in this location (${d.thrown} pitches)`;
        else if(d.thrown>=3&&d.contact>=2)reason='contact history here — review before calling';
        else if(loaded)reason='strike reliability · bases loaded';
        else if(dp&&gb)reason='ground-ball tendency · DP opportunity';
        else if(twoStrikes)reason='put-away option · limited location evidence';
        else if(behind)reason='strike-getter · limited location evidence';
        else reason='count and sequencing · limited location evidence';
        best={pitch:p,zone,score,reason};
      }
    });
  });
  return best;
}

  ];
  pitchers.forEach(ensurePitcherId);
  currentPitcherIdx=0; state.setupPitcherIdx=0;
  const fixtures=[
    {name:'MIA MARTINEZ',num:14,hand:'R',patterns:[['SLIDER','low-away','SWINGING STRIKE',8],['FASTBALL','mid-in','LINE DRIVE SAFE',5],['FASTBALL','mid-away','CALLED STRIKE',3]]},
    {name:'AVA BROOKS',num:3,hand:'L',patterns:[['CHANGEUP','out-low','SWINGING STRIKE',7],['FASTBALL','high-in','GROUND BALL OUT',5],['FASTBALL','mid-mid','LINE DRIVE SAFE',3]]},
    {name:'KAYLA REED',num:8,hand:'R',patterns:[['FASTBALL','high-mid','FOUL',6],['CURVEBALL','out-low-away','SWINGING STRIKE',5],['SLIDER','low-in','GROUND BALL OUT',4]]},
    {name:'JORDAN LEE',num:11,hand:'L',patterns:[['FASTBALL','mid-away','LINE DRIVE SAFE',6],['CHANGEUP','low-away','SWINGING STRIKE',4],['SLIDER','mid-in','CALLED STRIKE',3]]},
    {name:'SAM TAYLOR',num:5,hand:'R',patterns:[['FASTBALL','low-mid','GROUND BALL OUT',6],['SLIDER','out-away','BALL',4],['CURVEBALL','low-away','SWINGING STRIKE',3]]}
  ];
  scoutingBook={};
  setupBatters=fixtures.map(f=>{
    const history=[];
    f.patterns.forEach(([type,zone,result,n])=>{
      for(let i=0;i<n;i++){
        const h={type,zone,result,pitcherId:0,gameId:-1};
        if(/LINE DRIVE|GROUND BALL/.test(result)){
          h.contactType=result.startsWith('LINE')?'LINE DRIVE':'GROUND BALL';
          h.safe=result.endsWith('SAFE');
        }
        if(result==='FOUL')h.foulDirection=i%3===0?'BACK':(f.hand==='R'?'3B':'1B');
        history.push(h);
      }
    });
    // Second pitcher also has distinct location histories; no cross-pitcher inference.
    for(let i=0;i<6;i++)history.push({type:'DROP BALL',zone:'out-low',result:i<4?'SWINGING STRIKE':'BALL',pitcherId:1,gameId:-1});
    for(let i=0;i<5;i++)history.push({type:'RISE BALL',zone:'high-mid',result:i<3?'LINE DRIVE SAFE':'FOUL',contactType:i<3?'LINE DRIVE':undefined,safe:i<3,pitcherId:1,gameId:-1});
    scoutingBook[game.opponent+'::'+f.name]=history;
    return {num:f.num,name:f.name,hand:f.hand,history};
  });
  setupBench=[]; lineup=setupBatters.map((b,i)=>({...b,spot:i+1}));bench=[];
  currentGameId++;state.batterIdx=null;state.count={balls:0,strikes:0};state.outs=0;state.inning=1;state.currentAB=[];
  state.bases={first:false,second:false,third:false};state.modal=null;state.batterIdx=0;state.view='call';

}

function gameBatterRecord(b){
  const pitches=(b.history||[]).filter(h=>h.gameId===currentGameId);
  const endings=pitches.filter(h=>h.paEnd);
  let hits=0, atBats=0, walks=0;
  endings.forEach(h=>{
    if(h.paEnd==='walk'){walks++;return;}
    if(h.paEnd==='strikeout' || h.paEnd==='inplay'){
      atBats++;
      if(h.paEnd==='inplay' && h.safe===true) hits++;
    }
  });
  const fix=b.recordAdjust||{};
  hits=Math.max(0,hits+(+fix.hits||0));
  atBats=Math.max(hits,atBats+(+fix.atBats||0));
  walks=Math.max(0,walks+(+fix.walks||0));
  return {hits,atBats,walks};
}

// Heat map data + rendering — whiff rate aggregated across all pitch types (per user
// decision), same 3x3 + 4 chase-corner buckets as the zone-call screen. Chase corners are
// placed at the outer diagonal corners of a 5x5 canvas (matching where those pitches
// actually sit relative to the zone); the 12 non-corner edge cells have no data source in
// this app and stay blank. A gaussian blur over the colored cells approximates the smooth
// gradient of a real heat map, with a crisp strike-zone box drawn on top — same visual
// trick Statcast-style heat maps use. Cells under HEATMAP_MIN_SAMPLE stay neutral gray
// rather than getting colored off too little data.
const HEATMAP_MIN_SAMPLE = 2;
const HEATMAP_CELLS = [
  {key:'out-high-in', col:0, row:0}, {key:null,col:1,row:0}, {key:'out-high',col:2,row:0}, {key:null,col:3,row:0}, {key:'out-high-away', col:4, row:0},
  {key:null,col:0,row:1}, {key:'high-in',col:1,row:1}, {key:'high-mid',col:2,row:1}, {key:'high-away',col:3,row:1}, {key:null,col:4,row:1},
  {key:'out-in',col:0,row:2}, {key:'mid-in',col:1,row:2}, {key:'mid-mid',col:2,row:2}, {key:'mid-away',col:3,row:2}, {key:'out-away',col:4,row:2},
  {key:null,col:0,row:3}, {key:'low-in',col:1,row:3}, {key:'low-mid',col:2,row:3}, {key:'low-away',col:3,row:3}, {key:null,col:4,row:3},
  {key:'out-low-in', col:0,row:4}, {key:null,col:1,row:4}, {key:'out-low',col:2,row:4}, {key:null,col:3,row:4}, {key:'out-low-away', col:4,row:4}
];

function isSafeContact(h){ return h.safe===true || / SAFE$/.test(h.result||''); }
function zoneEffectiveness(b, pitchType){
  const map={}; HEATMAP_CELLS.filter(c=>c.key).forEach(c=>map[c.key]={thrown:0,whiffs:0,contact:0,score:0});
  b.history.forEach(h=>{
    if(!(h.zone in map) || (pitchType && (h.type!==pitchType || !samePitcher(h,currentPitcherIdx))))return;
    const d=map[h.zone]; d.thrown++;
    if(['SWINGING STRIKE','DROPPED THIRD SWINGING'].includes(h.result)){ d.whiffs++; d.score-=1; }
    else if(h.contactType && isSafeContact(h)){
      d.contact++; d.score+=h.contactType==='LINE DRIVE'?1.25:1;
    } else if(h.contactType && !isSafeContact(h)){
      d.score+=h.contactType==='LINE DRIVE'?0.1:-0.15;
    }
  });
  return map;
}
function heatMapHasData(b){return Object.values(zoneEffectiveness(b)).some(d=>d.thrown>=HEATMAP_MIN_SAMPLE);}
function heatColor(value){
  // negative = whiffs/weakness (blue), positive = successful contact (red), zero = neutral
  const neutral=[100,106,113], cold=[63,135,197], hot=[209,80,62];
  const target=value<0?cold:hot, t=Math.min(1,Math.abs(value));
  return `rgb(${neutral.map((v,i)=>Math.round(v+(target[i]-v)*t)).join(',')})`;
}

function batterSilhouette(hand, leftSide){

function perspectiveControl(){
  return `<div class="asb-perspective" data-action="togglePerspective">${locationPerspective==='catcher'?'CATCHER':'PITCHER'} VIEW ⇄</div>`;
}
function heatMapMarkup(b){
  const map = zoneEffectiveness(b);
  const leftIsInside=(locationPerspective==='catcher') ? b.hand==='R' : b.hand==='L';
  const cellSize = 60;
  const rects = HEATMAP_CELLS.map(c=>{
    if(!c.key) return '';
    const d = map[c.key];
    const x = (leftIsInside ? 4-c.col : c.col)*cellSize, y = c.row*cellSize;
    if(!d || d.thrown < HEATMAP_MIN_SAMPLE){
      return `<rect x="${x}" y="${y}" width="${cellSize}" height="${cellSize}" fill="rgba(255,255,255,0.035)"/>`;
    }
    const evidence=Math.min(1,d.thrown/6);
    const value=(d.score/d.thrown)*evidence;
    return `<rect x="${x}" y="${y}" width="${cellSize}" height="${cellSize}" fill="${heatColor(value)}"/>`;
  }).join('');

  return `
    <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" style="width:100%; display:block; border-radius:14px;">
      <defs>
        <filter id="heatBlur" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="16"/>
        </filter>
      </defs>
      <rect x="0" y="0" width="300" height="300" fill="rgba(0,0,0,0.18)"/>
      <g filter="url(#heatBlur)">${rects}</g>
      <rect x="60" y="60" width="180" height="180" fill="none" stroke="var(--chalk)" stroke-width="2" stroke-opacity="0.6"/>
      <line x1="120" y1="60" x2="120" y2="240" stroke="var(--chalk)" stroke-opacity="0.22" stroke-width="1"/>
      <line x1="180" y1="60" x2="180" y2="240" stroke="var(--chalk)" stroke-opacity="0.22" stroke-width="1"/>
      <line x1="60" y1="120" x2="240" y2="120" stroke="var(--chalk)" stroke-opacity="0.22" stroke-width="1"/>
      <line x1="60" y1="180" x2="240" y2="180" stroke="var(--chalk)" stroke-opacity="0.22" stroke-width="1"/>
    </svg>
  `;
}

// Two thumb-sized buttons (same class/size as the pitch-call grid) that open the stats
// table and heat map pop-outs directly on tap — no separate toggle + VIEW button anymore.
// See backlog for the note on possibly moving the stats table back fully inline once
// there's coach feedback on the suggestion badge.
function pitchStatsHTML(b){
  const stats = typeStats(b.history);
  const thrownTypes = currentArsenal().filter(t=>stats[t].thrown>0);
  const hmReady = heatMapHasData(b);

  return `
    <div class="label">VS THIS BATTER</div>

function zoneHTML(){
  const batter=currentBatter();
  const leftIsInside=(locationPerspective==='catcher') ? batter.hand==='R' : batter.hand==='L';
  const side=(col)=>col==='left'?(leftIsInside?'in':'away'):(leftIsInside?'away':'in');
  const display=(z)=>z.replace('out-','').replace('mid-mid','CENTER').replace('mid','MID').replaceAll('-',' ').toUpperCase();
  const cell=(z,col,row,extra='')=>`<div class="asb-zone ${z.startsWith('out-')?'asb-chase':'asb-strike'} ${extra}" style="grid-column:${col};grid-row:${row}" data-action="pickLocation" data-zone="${z}"><span>${display(z)}</span></div>`;
  const L=side('left'), R=side('right');
  const grid=[
    cell('out-high-'+L,'1 / span 2','1 / span 2','asb-corner top-left'),
    cell('out-high',3,1),
    cell('out-high-'+R,'4 / span 2','1 / span 2','asb-corner top-right'),
    cell('out-'+L,1,3),cell('out-'+R,5,3),
    cell('out-low-'+L,'1 / span 2','4 / span 2','asb-corner bottom-left'),
    cell('out-low',3,5),
    cell('out-low-'+R,'4 / span 2','4 / span 2','asb-corner bottom-right')
  ];
  ['high','mid','low'].forEach((height,r)=>{
    [L,'mid',R].forEach((width,c)=>grid.push(cell(height==='mid'&&width==='mid'?'mid-mid':height+'-'+width,c+2,r+2)));
  });
  return `
    <div class="calltag">${state.pitch} <span>Location</span></div>
    ${perspectiveControl()}
    <div class="asb-zone-batter"><div class="asb-zone-batter-name">${batter.name} · ${batter.hand}HB</div><div class="asb-zone-batter-meta">${recordLabel(batter)}</div></div>
    <div class="asb-location-area">
      ${batterSilhouette(batter.hand,leftIsInside)}
      <div class="asb-grid-wrap">${grid.join('')}</div>
    </div>
    <div class="zone-caption">Green = strike zone · Blue = chase locations</div>
    <div class="label">QUICK ENTRY — LOCATION UNKNOWN</div>
    <div class="asb-quick-grid">
      <div class="asb-quick ball" data-action="quickResult" data-val="BALL">BALL</div>
      <div class="asb-quick foul" data-action="quickResult" data-val="FOUL">FOUL</div>
      <div class="asb-quick strike" data-action="quickResult" data-val="CALLED STRIKE">CALLED STRIKE</div>
      <div class="asb-quick strike" data-action="quickResult" data-val="SWINGING STRIKE">SWINGING STRIKE</div>
    </div>`;
}

function ordinal(n){ return n+['th','st','nd','rd'][(n%100>3&&n%100<21)?0:n%10]; }
function shortType(t){ const f = MASTER_PITCHES.find(p=>p.key===t); return f ? f.abbr : t; }
function shortResult(r){
  const legacy = {'DROPPED THIRD CALLED':'drop K called','DROPPED THIRD SWINGING':'drop K swing','CALLED STRIKE':'called K','SWINGING STRIKE':'swing K','BALL':'ball','FOUL':'foul','GROUND OUT':'GO','FLY OUT':'FO','LINE OUT':'LO',"FIELDER'S CHOICE":'FC','SINGLE':'1B','DOUBLE':'2B','TRIPLE':'3B','HOME RUN':'HR'};
  if(legacy[r]) return legacy[r];
  const m = /^(GROUND BALL|LINE DRIVE|FLY BALL|POP UP) (OUT|SAFE)$/.exec(r);
  if(m) return contactAbbr(m[1]) + ' ' + (m[2]==='SAFE' ? 'safe' : 'out');
  return r;
}
function zoneLabel(z){
  if(!z) return '';
  if(z.startsWith('out-')){
    const v=z.replace('out-','');
    return 'chase · ' + ({in:'inside',away:'outside',high:'high',low:'low'}[v]||v.replace('-', ' / '));
  }
  return z.replace('-', ' / ');
}

            <div class="chase-btn ${d.hand==='R'?'selected':''}" data-action="setDraftHand" data-hand="R">THROWS R</div>
          </div>
          <div class="modal-section-label">ARSENAL</div>
          <div class="pitch-grid" style="gap:6px;">
            ${arsenalBtns}
            <div class="pitch-btn" style="border-style:dashed; color:var(--amber); border-color:var(--amber); font-size:12px; padding:12px 6px;" data-action="openAddCustomPitchFromDraft">+ ADD PITCH</div>
          </div>
          <div class="modal-btn-row" style="margin-top:14px;">
            ${editing?`<div class="modal-btn keep ${d.arsenal.length?'':'disabled'}" data-action="confirmEditPitcher">UPDATE EXISTING PITCHER</div>
            <div class="modal-btn" data-action="confirmCreateFromEdit">CREATE NEW PITCHER</div>`:`<div class="modal-btn keep ${d.arsenal.length?'':'disabled'}" data-action="submitAddPitcher">ADD &amp; SET ACTIVE</div>
            <div class="modal-btn ${d.arsenal.length?'':'disabled'}" data-action="submitAddPitcherBench">ADD TO BENCH</div>`}
          </div>
          ${editing?'<div class="modal-desc">Updating preserves all existing statistics and pitch records. Creating a new pitcher starts separate history.</div>':''}
          <div class="modal-cancel" data-action="${editing?'closeModal':'openPitcherList'}">CANCEL</div>
        </div>
      </div>`;
  }

  if(state.modal.type==='addCustomPitch'){
    return `
      <div class="modal-overlay">
        <div class="modal-card">
          <div class="modal-title">Add New Pitch Type</div>
          <div class="modal-input-row">
            <input id="customPitchName" class="modal-input" style="flex:1;" type="text" placeholder="e.g. SPLIT-FINGER" value="${state.modal.name}">
          </div>
          <div class="modal-btn-row">
            <div class="modal-btn keep" data-action="submitCustomPitch">ADD PITCH</div>
          </div>
          <div class="modal-cancel" data-action="cancelCustomPitch">CANCEL</div>
        </div>
      </div>`;
  }

  if(state.modal.type==='confirmAction'){
    const m = state.modal;
    return `
      <div class="modal-overlay">
        <div class="modal-card">
          <div class="modal-title">${m.title}</div>
          <div class="modal-desc">${m.message}</div>
          <div class="modal-btn-row">
            <div class="modal-btn reset" data-action="confirmActionYes">YES, CONTINUE</div>
            <div class="modal-btn keep" data-action="closeModal">CANCEL</div>
          </div>
        </div>

  if(state.modal.type==='heatMapModal'){
    const b = lineup[state.modal.batterIdx];
    return `
      <div class="modal-overlay" data-action="closeModal">
        <div class="modal-card" style="max-width:340px;">
          <div class="modal-title">${b.name} — BATTER EFFECTIVENESS MAP</div>
          <div style="text-align:center; color:var(--chalk); font-size:12px; font-weight:700; letter-spacing:0.08em; margin:0 0 10px;">${b.hand === 'L' ? 'LHB BATTER' : 'RHB BATTER'}</div>
          ${perspectiveControl()}
          <div class="asb-heat-shadow-area">
            ${batterSilhouette(b.hand,(locationPerspective==='catcher') ? b.hand==='R' : b.hand==='L')}
            <div class="asb-heat-front">${heatMapMarkup(b)}</div>
          </div>
          <div class="heat-legend"><span style="color:var(--danger);">hot (successful contact)</span><span class="heat-legend-bar"></span><span style="color:var(--steel-light);">cold (more whiffs)</span></div>
          <div class="field-caption">Box = strike zone. Outer edges = chase pitches. Faint gray = fewer than ${HEATMAP_MIN_SAMPLE} pitches logged there.</div>
          <div class="modal-cancel">Tap anywhere to close</div>
        </div>
      </div>`;
  }

  if(state.modal.type==='statsModal'){
    const b = lineup[state.modal.batterIdx];
    return `
      <div class="modal-overlay" data-action="closeModal">
        <div class="modal-card" style="max-width:340px;">
          <div class="modal-title">${b.name} — PITCH BREAKDOWN</div>
          ${statRowsMarkup(b)}
          <div class="modal-cancel">Tap anywhere to close</div>

  }

  if(state.modal.type==='sprayChartModal'){
    const b = lineup[state.modal.batterIdx];
    const pts = b.history.filter(h => h.gameId===currentGameId && h.sprayLoc);
    return `
      <div class="modal-overlay" data-action="closeModal">
        <div class="modal-card" style="max-width:340px;">
          <div class="modal-title">${b.name} — SPRAY CHART</div>

            <svg class="field-svg readonly" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
              ${fieldOutlineSVG()}
              ${sprayDotsMarkup(pts)}
            </svg>
            <div class="field-caption"><span style="color:var(--good);">●</span> reached base &nbsp; <span style="color:var(--danger);">●</span> out — contact type above each dot, pitch type below</div>
          </div>
          <div class="modal-cancel">Tap anywhere to close</div>
        </div>
      </div>`;
  }

  return '';
}

function showToast(msg){
  render();
  requestAnimationFrame(()=>{
    const t = document.getElementById('toast');
    if(!t) return;
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 1300);
  });
}

function logPitch(){
  const b = currentBatter();
  const record = {type:state.pitch, zone:state.zone, result:state.outcome, gameId:currentGameId};
  if(state.droppedThird)record.uncaughtThird=true;
  if(state.contactType) record.contactType = state.contactType;
  if(state.foulDirection) record.foulDirection = state.foulDirection;
  record.pitcherId = currentPitcherIdx;
  record.pitcherUid=ensurePitcherId(pitchers[currentPitcherIdx]);
  if(state.sprayLoc) record.sprayLoc = state.sprayLoc;
  if(state.ballSafe!==null) record.safe = state.ballSafe;
  b.history.push(record);
  state.currentAB.push(record);

  let endsAB = false;
  let msg = '';

  if(state.outcome==='BALL'){
    state.count.balls++;
    msg = 'Logged: ball ' + state.count.balls;
    if(state.count.balls>=4){ endsAB=true; record.paEnd='walk'; msg='Walk logged'; }
  } else if(state.outcome==='FOUL'){
    if(state.count.strikes<2) state.count.strikes++;
    msg = state.count.strikes>=2 ? 'Logged: foul · count stays at 2 strikes' : 'Logged: foul · strike ' + state.count.strikes;
  } else if(['CALLED STRIKE','SWINGING STRIKE','DROPPED THIRD CALLED','DROPPED THIRD SWINGING'].includes(state.outcome)){
    state.count.strikes++;
    msg = 'Logged: strike ' + state.count.strikes;
    if(state.count.strikes>=3){
      endsAB=true;record.strikeout=true;record.paEnd='strikeout';
      if(state.droppedThird){
        if(state.ballSafe===true){state.bases.first=true;msg='Uncaught third strike — batter safe; verify runners';}
        else {state.outs++;msg='Uncaught third strike — batter out';}
      }else {state.outs++;msg='Strikeout logged';}
    }
  } else {
    endsAB = true;record.paEnd='inplay';
    const outsOnPlay = state.bipOuts || (state.ballSafe===false ? 1 : 0);
    if(outsOnPlay>0) state.outs += outsOnPlay;
    msg = state.outcome.toLowerCase() + ' logged';
  }

  if(endsAB){
    state.count = {balls:0, strikes:0};
    state.currentAB = [];
    state.batterIdx = (state.batterIdx+1) % lineup.length;
    lineup.forEach((bb,i)=> bb.spot = ((i - state.batterIdx + lineup.length) % lineup.length) + 1);
    if(state.outs>=3){ state.outs=0; state.inning++; state.bases={first:false, second:false, third:false}; }
  }

  state.view='call';
  state.pitch=null; state.zone=null; state.outcome=null;
  state.contactType=null; state.sprayLoc=null; state.ballSafe=null; state.bipOuts=null; state.foulDirection=null; state.droppedThird=false;
  showToast(msg);
}

function adjustOutCount(delta){
  if(delta>0){
    state.outs++;
    if(state.outs>=3){
      state.outs=0;
      state.inning++;
      state.bases={first:false, second:false, third:false};
      state.count={balls:0,strikes:0};
      state.currentAB=[];
      showToast('Third out added — inning advanced');
      return;
    }
    showToast('Out added');
    return;
  }

  if(state.outs>0){
    state.outs--;
    showToast('Out removed');
    return;
  }
  if(state.inning>1){
    state.inning--;
    state.outs=2;
    showToast('Returned to previous inning — verify bases');
  }
}

function finalizeSub(idx, source, keepCount){
  if(source==='lineup'){
    state.batterIdx = idx;
  } else {
    const newPlayer = bench.splice(idx,1)[0];
    const oldBatter = lineup[state.batterIdx];
    newPlayer.spot = oldBatter.spot;
    lineup[state.batterIdx] = newPlayer;
    bench.push(oldBatter);
  }
  if(!keepCount){
    state.count = {balls:0, strikes:0};
    state.currentAB = [];
  }
}

function doRestartGame(){
  state.batterIdx=null; state.pitch=null; state.zone=null;
  state.count={balls:0,strikes:0}; state.outs=0; state.inning=1; state.currentAB=[];
  state.bases={first:false, second:false, third:false};
  state.contactType=null; state.sprayLoc=null; state.ballSafe=null; state.bipOuts=null; state.foulDirection=null;
  currentGameId++;
  state.modal=null; state.view='lineup';
  render();
}

function doNewGame(){
  lineup=[]; bench=[]; setupBatters=[]; setupBench=[];
  game = {opponent:'', pitcher:{num:'',first:'',last:'',hand:'R',arsenal:[]}};
  state.view='setupTeam'; state.batterIdx=null; state.pitch=null; state.zone=null;
  state.count={balls:0,strikes:0}; state.outs=0; state.inning=1; state.currentAB=[]; state.modal=null; state.setupPitcherIdx=null;
  state.bases={first:false, second:false, third:false};
  state.contactType=null; state.sprayLoc=null; state.ballSafe=null; state.bipOuts=null; state.foulDirection=null;
  render();
}

function doEndGame(){
  doNewGame();
}

function attachHandlers(){
  document.querySelectorAll('[data-action]').forEach(node=>{
    node.addEventListener('click', (e)=>{
      const action = node.dataset.action;
      if(action==='lineup'){ state.view='lineup'; render(); }
      else if(action==='returnToGame'){ state.modal=null; state.view='call'; render(); }
      else if(action==='openLineupAdd'){state.modal={type:'addPlayer',num:'',first:'',last:'',hand:'R',fromLineup:true};render();}
      else if(action==='lineupReorderHelp'){showToast('Use EDIT on a batter to change batting position');}
      else if(action==='editLineupPlayer'){state.modal={type:'editLineupPlayer',source:node.dataset.source,idx:+node.dataset.idx};render();}
      else if(action==='lineupHand'){subPlayer(state.modal.source,state.modal.idx).hand=node.dataset.hand;render();}
      else if(action==='saveLineupPlayer'){
        const m=state.modal,b=subPlayer(m.source,m.idx),r=gameBatterRecord(b);
        const val=id=>document.getElementById(id)?.value;
        const num=val('editLineupNum').trim(),name=val('editLineupName').trim().toUpperCase();
        const hits=Math.max(0,+val('editHits')||0),ab=Math.max(hits,+val('editAB')||0),walks=Math.max(0,+val('editBB')||0);
        if(!name){showToast('Enter a player name');return;}
        b.name=name;b.num=num||'--';
        const base=b.recordAdjust||{};
        b.recordAdjust={hits:(+base.hits||0)+hits-r.hits,atBats:(+base.atBats||0)+ab-r.atBats,walks:(+base.walks||0)+walks-r.walks};
        if(m.source==='lineup'){
          const target=Math.max(0,Math.min(lineup.length-1,(+val('editLineupSpot')||m.idx+1)-1));
          if(target!==m.idx){const moved=lineup.splice(m.idx,1)[0];lineup.splice(target,0,moved);if(state.batterIdx===m.idx)state.batterIdx=target;else if(m.idx<state.batterIdx&&target>=state.batterIdx)state.batterIdx--;else if(m.idx>state.batterIdx&&target<=state.batterIdx)state.batterIdx++;}
          lineup.forEach((x,i)=>x.spot=i+1);
        }
        state.modal=null;render();
      }
      else if(action==='lineupInsertBench'){state.modal={type:'lineupSubTarget',benchIdx:+node.dataset.idx};render();}
      else if(action==='confirmLineupSub'){
        const target=+node.dataset.idx, incoming=bench.splice(state.modal.benchIdx,1)[0], outgoing=lineup[target];
        incoming.spot=target+1;lineup[target]=incoming;bench.push(outgoing);
        if(target===state.batterIdx){state.count={balls:0,strikes:0};state.currentAB=[];}
        state.modal=null;render();
      }
      else if(action==='goBack'){ goBack(); }
      else if(action==='setupNextTeam'){
        if(!game.opponent.trim()) game.opponent='OPPONENT';
        if(pitchers.length>0){ state.view='setupPitcherPick'; }
        else { game.pitcher = {num:'',first:'',last:'',hand:'R',arsenal:[]}; state.view='setupPitcherAdd'; }
        render();
      }
      else if(action==='pickSetupPitcher'){ state.setupPitcherIdx = parseInt(node.dataset.idx); state.view='setupLineup'; render(); }
      else if(action==='goToPitcherAddForm'){ game.pitcher = {num:'',first:'',last:'',hand:'R',arsenal:[]}; state.view='setupPitcherAdd'; render(); }
      else if(action==='setPitcherHand'){ game.pitcher.hand = node.dataset.hand; render(); }
      else if(action==='toggleArsenal'){
        const v = node.dataset.val;
        const i = game.pitcher.arsenal.indexOf(v);
        if(i>-1) game.pitcher.arsenal.splice(i,1); else game.pitcher.arsenal.push(v);
        render();
      }
      else if(action==='setupNextPitcher'){
        if(!game.pitcher.arsenal.length) return;
        pitchers.push({...game.pitcher, id:'pitcher-'+(nextPitcherId++), arsenal: game.pitcher.arsenal.slice()});
        state.setupPitcherIdx = pitchers.length-1;
        state.view='setupLineup';
        render();
      }
      else if(action==='openAddSetupBatter'){ state.modal = {type:'addSetupBatter', num:'', first:'', last:'', hand:'R'}; render(); }
      else if(action==='submitAddSetupBatter' || action==='submitAddSetupBatterNext'){
        const name = [state.modal.first, state.modal.last].map(s=>(s||'').trim()).filter(Boolean).join(' ').toUpperCase();
        if(!name) return;
        const numVal = parseInt(state.modal.num);
        setupBatters.push({num: isNaN(numVal) ? '--' : numVal, name, hand: state.modal.hand||'R', history: getScoutingHistory(name, game.opponent)});
        state.modal = action==='submitAddSetupBatterNext' ? {type:'addSetupBatter',num:'',first:'',last:'',hand:state.modal.hand||'R'} : null;
        render();
        if(state.modal && state.modal.type==='addSetupBatter') { const input=document.getElementById('addPlayerNum'); if(input)input.focus(); }
      }
      else if(action==='submitAddSetupBench'){
        const name = [state.modal.first, state.modal.last].map(s=>(s||'').trim()).filter(Boolean).join(' ').toUpperCase();
        if(!name) return;
        const numVal = parseInt(state.modal.num);
        setupBench.push({num: isNaN(numVal) ? '--' : numVal, name, hand: state.modal.hand||'R', history: getScoutingHistory(name, game.opponent)});
        state.modal = null;
        render();
      }
      else if(action==='removeSetupBatter'){ setupBatters.splice(parseInt(node.dataset.idx),1); render(); }
      else if(action==='removeSetupBenchPlayer'){ setupBench.splice(parseInt(node.dataset.idx),1); render(); }
      else if(action==='startGame'){
        if(!setupBatters.length) return;
        lineup = setupBatters.map((b,i)=>({...b, spot:i+1}));
        bench = setupBench.slice();
        currentPitcherIdx = state.setupPitcherIdx;
        currentGameId++;
        state.batterIdx = 0; state.count={balls:0,strikes:0}; state.outs=0; state.inning=1; state.currentAB=[];
        state.bases={first:false, second:false, third:false};
        state.view='call';
        render();
      }
      else if(action==='loadTestMode'){ loadTestMode(); }
      else if(action==='pickBatter'){ state.batterIdx = parseInt(node.dataset.idx); state.currentAB=[]; state.count={balls:0,strikes:0}; state.view='call'; render(); }
      else if(action==='pickPitch'){ state.pitch = node.dataset.pitch; state.view='zone'; render(); }
      else if(action==='pickZoneCell'){ state.zone = node.dataset.zone; state.view='outcome'; render(); }
      else if(action==='pickChase'){ state.zone = 'out-' + node.dataset.val; state.view='outcome'; render(); }
      else if(action==='pickLocation'){ state.zone=node.dataset.zone; state.view='outcome'; render(); }
      else if(action==='togglePerspective'){ e.stopPropagation(); locationPerspective=locationPerspective==='catcher'?'pitcher':'catcher'; render(); }
      else if(action==='quickResult'){ state.zone=null; state.outcome=node.dataset.val; state.foulDirection=null; logPitch(); }
      else if(action==='droppedThird'){ state.outcome=node.dataset.val; state.droppedThird=true; state.view='droppedResult'; render(); }
      else if(action==='finishDropped'){ state.ballSafe=node.dataset.val==='SAFE'; logPitch(); }
      else if(action==='goInPlay'){ state.view='inplayField'; render(); }
      else if(action==='pickSprayLoc'){
        const rect = node.getBoundingClientRect();
        const xPct = Math.round(((e.clientX-rect.left)/rect.width)*1000)/10;
        const yPct = Math.round(((e.clientY-rect.top)/rect.height)*1000)/10;
        state.sprayLoc = {x:xPct, y:yPct};
        state.view = 'inplayContact';
        render();
      }
      else if(action==='pickContactType'){ state.contactType = node.dataset.val; state.view='inplayResult'; render(); }
      else if(action==='pickBallInPlayResult'){
        const v = node.dataset.val;
        state.ballSafe = v==='SAFE';
        state.bipOuts = v==='DP' ? 2 : (v==='OUT' ? 1 : 0);
        state.outcome = v==='DP' ? state.contactType + ' DOUBLE PLAY' : state.contactType + ' ' + v;
        logPitch();
      }
      else if(action==='toggleBase'){
        const key = node.dataset.base;
        state.bases[key] = !state.bases[key];
        render();
      }
      else if(action==='adjustOut'){ adjustOutCount(parseInt(node.dataset.delta)); }
      else if(action==='goFoulDirection'){ state.view='foulDirection'; render(); }
      else if(action==='pickFoulDirection'){ state.foulDirection=node.dataset.val; state.outcome='FOUL'; logPitch(); }
      else if(action==='pickOutcome'){ state.outcome = node.dataset.val; logPitch(); }
      else if(action==='changeBatter'){ state.modal = {type:'changeBatter'}; render(); }
      else if(action==='selectSub'){
        const idx = parseInt(node.dataset.idx);
        const source = node.dataset.source;
        const abInProgress = state.currentAB.length>0 || state.count.balls>0 || state.count.strikes>0;
        if(abInProgress){
          state.modal = {type:'confirmCount', pendingIdx:idx, source};
        } else {
          finalizeSub(idx, source, false);
          state.modal = null;
        }
        render();
      }
      else if(action==='keepCount'){ finalizeSub(state.modal.pendingIdx, state.modal.source, true); state.modal=null; render(); }
      else if(action==='resetCount'){ finalizeSub(state.modal.pendingIdx, state.modal.source, false); state.modal=null; render(); }
      else if(action==='openAddPlayer'){ state.modal = {type:'addPlayer', num:'', first:'', last:'', hand:'R'}; render(); }
      else if(action==='setAddHand'){ state.modal.hand = node.dataset.hand; render(); }
      else if(action==='backToChangeBatter'){ state.modal = {type:'changeBatter'}; render(); }
      else if(action==='submitAddPlayer'){
        const name = [state.modal.first, state.modal.last].map(s=>(s||'').trim()).filter(Boolean).join(' ').toUpperCase();
        if(!name) return;
        const numVal = parseInt(state.modal.num);
        bench.push({num: isNaN(numVal) ? '--' : numVal, name, hand: state.modal.hand||'R', history: getScoutingHistory(name, game.opponent)});
        state.modal = null;state.view='lineup';
        render();
      }
      else if(action==='closeModal'){ state.modal=null; render(); }
      else if(action==='openOptions'){ state.modal = {type:'options'}; render(); }
      else if(action==='openEditInning'){ state.modal={type:'editInning'}; render(); }
      else if(action==='backToOptions'){ state.modal={type:'options'}; render(); }
      else if(action==='saveEditedInning'){
        const raw=document.getElementById('editInningNumber')?.value;
        const inning=Number(raw);
        if(!Number.isInteger(inning)||inning<1||inning>99){showToast('Enter an inning from 1 to 99');return;}
        state.inning=inning;
        state.modal=null;
        render();
        showToast('Inning set to '+inning);
      }
      else if(action==='openHeatMapModal'){ state.modal = {type:'heatMapModal', batterIdx: parseInt(node.dataset.idx)}; render(); }
      else if(action==='openStatsModal'){ state.modal = {type:'statsModal', batterIdx: parseInt(node.dataset.idx)}; render(); }
      else if(action==='openSprayChartModal'){ state.modal = {type:'sprayChartModal', batterIdx: parseInt(node.dataset.idx)}; render(); }
      else if(action==='openPitcherList'){ state.modal = {type:'pitcherList'}; render(); }
      else if(action==='selectPitcher'){
        currentPitcherIdx = parseInt(node.dataset.idx);
        state.modal = null;
        showToast('Now pitching: ' + currentPitcherName());
      }
      else if(action==='editCurrentPitcher'){
        const p=pitchers[currentPitcherIdx];
        state.modal={type:'editPitcherForm',targetIdx:currentPitcherIdx,draft:{num:p.num,first:p.first,last:p.last,hand:p.hand,arsenal:p.arsenal.slice()}}; render();
      }
      else if(action==='editSetupPitcher'){
        const idx=parseInt(node.dataset.idx),p=pitchers[idx];
        state.modal={type:'editPitcherForm',targetIdx:idx,draft:{num:p.num,first:p.first,last:p.last,hand:p.hand,arsenal:p.arsenal.slice()}};render();
      }
      else if(action==='confirmEditPitcher'){
        const d=state.modal.draft; if(!d.arsenal.length)return;
        const p=pitchers[state.modal.targetIdx]; ensurePitcherId(p);
        Object.assign(p,{num:d.num,first:d.first,last:d.last,hand:d.hand,arsenal:d.arsenal.slice()});
        state.modal=null;showToast('Pitcher updated — statistics preserved');
      }
      else if(action==='confirmCreateFromEdit'){
        const d=state.modal.draft; if(!d.arsenal.length)return;
        pitchers.push({...d,id:'pitcher-'+(nextPitcherId++),arsenal:d.arsenal.slice()});
        currentPitcherIdx=pitchers.length-1;state.modal=null;showToast('New pitcher created — separate statistics');
      }
      else if(action==='openAddPitcherForm'){ state.modal = {type:'addPitcherForm', draft:{num:'',first:'',last:'',hand:'R',arsenal:[]}}; render(); }
      else if(action==='setDraftHand'){ state.modal.draft.hand = node.dataset.hand; render(); }
      else if(action==='toggleDraftArsenal'){
        const v = node.dataset.val;
        const arr = state.modal.draft.arsenal;
        const i = arr.indexOf(v);
        if(i>-1) arr.splice(i,1); else arr.push(v);
        render();
      }
      else if(action==='submitAddPitcher'){
        const d = state.modal.draft;
        if(!d.arsenal.length) return;
        pitchers.push({...d, id:'pitcher-'+(nextPitcherId++), arsenal: d.arsenal.slice()});
        currentPitcherIdx = pitchers.length-1;
        state.modal = null;
        showToast('Now pitching: ' + currentPitcherName());
      }
      else if(action==='submitAddPitcherBench'){
        const d = state.modal.draft;
        if(!d.arsenal.length) return;
        pitchers.push({...d, id:'pitcher-'+(nextPitcherId++), arsenal: d.arsenal.slice()});
        const name = (d.first+' '+d.last).trim()||'Pitcher';
        state.modal = {type:'pitcherList'};
        showToast('Added to staff: ' + name);
      }
      else if(action==='openAddCustomPitchSetup'){ state.modal = {type:'addCustomPitch', name:'', target: game.pitcher.arsenal, returnModal:null}; render(); }
      else if(action==='openAddCustomPitchFromDraft'){
        const draftRef = state.modal.draft;
        state.modal = {type:'addCustomPitch', name:'', target: draftRef.arsenal, returnModal:{type:state.modal.type, targetIdx:state.modal.targetIdx, draft: draftRef}};
        render();
      }
      else if(action==='submitCustomPitch'){
        const raw = (state.modal.name||'').trim().toUpperCase();
        if(!raw) return;
        if(!state.modal.target.includes(raw)) state.modal.target.push(raw);
        const back = state.modal.returnModal;
        state.modal = back || null;
        render();
      }
      else if(action==='cancelCustomPitch'){ state.modal = state.modal.returnModal || null; render(); }
      else if(action==='openConfirmRestart'){ state.modal = {type:'confirmAction', title:'Restart Game?', message:'Resets score, count, outs, and inning back to the start of inning 1. Lineup and pitching staff stay the same.', onConfirm:doRestartGame}; render(); }
      else if(action==='openConfirmNew'){ state.modal = {type:'confirmAction', title:'Start New Game?', message:'Clears the opponent lineup so you can set up the next game. Your pitching staff and scouting reports on opponents carry over.', onConfirm:doNewGame}; render(); }
      else if(action==='openConfirmEnd'){ state.modal = {type:'confirmAction', title:'End Game?', message:'Clears the current lineup and bench back to a blank setup. Your pitching staff and scouting reports on opponents carry over.', onConfirm:doEndGame}; render(); }
      else if(action==='confirmActionYes'){ state.modal.onConfirm(); }
    });
  });
}

render();
</script>
</body>
</html>
